{% extends "base.html" %}
{% block title %}Удалить запись | Дневник{% endblock %}


{% block content %}
<div class="container mt-4">
    <h1>Удалить запись?</h1>
    <p>Вы уверены, что хотите удалить запись "<strong>{{ object.title }}</strong>"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'diary:entry_detail' object.pk %}" class="btn btn-secondary">Назад</a>
    </form>
</div>
{% endblock %}
