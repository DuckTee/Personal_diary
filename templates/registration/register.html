{% extends 'base.html' %}

{% block content %}
<div class="register-container">
    <h1 class="text-center mb-4" style="color: #4b2e83;">Регистрация</h1>

    <div style="height: 30px;"></div>

    <form method="post" class="register-form">
        {% csrf_token %}
        {{ form.as_p }}

        <!-- Кнопка регистрации -->
        <button type="submit"
                class="btn btn-primary btn-lg w-100"
                style="background-color: #8B00FF;
                       border-color: #8B00FF;
                       color: white;
                       box-shadow: none;
                       margin-top: 15px;
                       font-weight: 500;">
            Зарегистрироваться
        </button>
    </form>

    <div style="height: 30px;"></div>

    <!-- Ссылка на вход -->
    <p class="text-center">
        <a href="{% url 'login' %}"
           style="color: #4b2e83;
                  text-decoration: none;
                  font-weight: 500;">
            Уже есть аккаунт? Войти
        </a>
    </p>
</div>
{% endblock %}
